@if (auth.isAuthenticated()) {
  <mat-toolbar class="custom-toolbar">
    <div class="toolbar-main">
      <span class="brand">Betonator</span>
      <nav class="nav-links" aria-label="Główna nawigacja">
        <a mat-button routerLink="/competitions" routerLinkActive="active">Rozgrywki</a>
        <a mat-button routerLink="/me/matches" routerLinkActive="active">Dzisiaj</a>
        <a mat-button routerLink="/me/bets" routerLinkActive="active">Moje typy</a>
        @if (auth.isAdmin()) {
          <a mat-button routerLink="/admin/users" routerLinkActive="active">Użytkownicy</a>
        }
      </nav>
    </div>
    <span class="spacer"></span>
    <div class="account-actions">
      <span class="user">{{ auth.user()?.username }}</span>
      <button mat-button (click)="logout()">Wyloguj</button>
    </div>
  </mat-toolbar>
}
<main class="page-content">
  <router-outlet />
</main>
